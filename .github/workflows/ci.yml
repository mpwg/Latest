name: Latest verification
on:
  push:
    branches: [develop, main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check portable resources, localization and source boundaries
        run: python3 scripts/validate.py --portable
      - name: Verify frozen sources, artifact bindings and appcast history
        run: |
          python3 -m unittest discover -s Tests/ReleaseTests -p test_source_snapshot.py -v
          PYTHONPATH=Tests/ReleaseTests python3 -m unittest test_appcast.AppcastHistoryTests -v
  verify:
    needs: verify-portable
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify required SDK
        run: |
          xcodebuild -version
          swift --version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
      - name: Bootstrap locked dependencies
        run: python3 scripts/bootstrap.py
      - name: Build application and verification executable
        run: swift build
      - name: Run regression and integration fixtures
        run: .build/debug/LatestVerification
      - name: Check repository and localization
        run: python3 scripts/validate.py
      - name: Verify actual signed feed history
        run: PYTHONPATH=Tests/ReleaseTests python3 -m unittest test_appcast.AppcastSigningIntegrationTests -v
      - name: Compile disposable native acceptance fixtures
        run: |
          swiftc -swift-version 6 -warnings-as-errors -parse-as-library Tests/NativeFixtures/FixtureApp.swift -o .build/native-fixture-check
          swiftc -swift-version 6 -warnings-as-errors -parse-as-library Sources/LatestCore/*.swift Tests/NativeFixtures/NetworkAcceptance.swift -o .build/native-network-check
      - name: Run Swift Testing suite
        run: swift test --build-system native --enable-swift-testing --disable-xctest 2>&1 | tee .build/headless-tests.log
      - name: Build native GUI wrapper without UI automation
        run: xcodebuild -project Latest.xcodeproj -scheme Latest -destination 'platform=macOS' -derivedDataPath .build/xcode CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build
      - name: Package controlled debug bundle
        run: python3 scripts/package_app.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-27-evidence
          path: |
            .build/headless-tests.log
            .build/debug/Latest.app
